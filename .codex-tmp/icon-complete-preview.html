<!doctype html>
<meta charset="utf-8">

<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px; background: #020914; color: #fff; font: 700 14px Arial; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .case { min-height: 210px; padding: 18px; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); }
  .case small { display: block; margin-top: 4px; color: var(--text-muted); font-weight: 500; }
  .row { display: flex; align-items: center; justify-content: space-around; min-height: 132px; }
  .case :is(.campaign-mark, .settings-mark, .campaign-platform-mark) { --campaign-mark-size: 66px; --settings-mark-size: 66px; width: 66px; height: 66px; }
  .case .neon-media-icon { --neon-size: 66px; }
  .essential { --primary:#12d6e4;--primary-strong:#1683ff;--border:#2d5268;--surface:#091827;--text-muted:#91a8bc;--theme-icon-filter:saturate(1.04) brightness(1.02);--theme-platform-icon-filter:hue-rotate(184deg) saturate(.92) brightness(1.08); }
  .orbita { --primary:#08e2ef;--primary-strong:#1683ff;--border:#2a5c77;--surface:#06182b;--text-muted:#92aec3;--theme-icon-filter:saturate(1.18) brightness(1.04);--theme-platform-icon-filter:hue-rotate(184deg) saturate(1.08) brightness(1.08); }
  .cobalto { --primary:#5d91ff;--primary-strong:#7ec8ff;--border:#354b7a;--surface:#09142e;--text-muted:#9caacc;--theme-icon-filter:hue-rotate(18deg) saturate(.92) brightness(1.08);--theme-platform-icon-filter:hue-rotate(220deg) saturate(.96) brightness(1.1); }
  .aurora { --primary:#32e6c1;--primary-strong:#53bfff;--border:#2d615f;--surface:#08252b;--text-muted:#8fbab4;--theme-icon-filter:hue-rotate(-18deg) saturate(.94) brightness(1.06);--theme-platform-icon-filter:hue-rotate(168deg) saturate(.92) brightness(1.08); }
  .solar { --primary:#ffb547;--primary-strong:#39cfe4;--border:#655137;--surface:#211910;--text-muted:#bda888;--theme-icon-filter:sepia(.84) saturate(1.9) hue-rotate(350deg) brightness(1.06);--theme-platform-icon-filter:hue-rotate(36deg) saturate(.92) brightness(1.08); }
  .indigo { --primary:#a5a6ff;--primary-strong:#26d8e5;--border:#554d80;--surface:#181331;--text-muted:#a59dbf;--theme-icon-filter:hue-rotate(34deg) saturate(.88) brightness(1.08);--theme-platform-icon-filter:hue-rotate(238deg) saturate(.86) brightness(1.12); }
  .lunar { --primary:#006dcc;--primary-strong:#007f8d;--border:#9eb5c4;--surface:#f7fbfd;--text:#071c33;--text-muted:#506a80;color:#071c33;--theme-icon-filter:saturate(1.12) brightness(.82) contrast(1.14);--theme-platform-icon-filter:hue-rotate(208deg) saturate(1.04) brightness(.84) contrast(1.12); }
</style>
