<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="http://127.0.0.1:3000/app.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px; background: #020914; color: #fff; font: 700 14px Arial; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .case { min-height: 170px; padding: 18px; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); }
  .case small { display: block; margin-top: 4px; color: var(--text-muted); font-weight: 500; }
  .row { display: flex; align-items: center; justify-content: space-around; min-height: 100px; }
  .campaign-platform-mark { --campaign-mark-size: 54px; width: 54px; height: 54px; }
  .essential { --primary:#12d6e4;--border:#2d5268;--surface:#091827;--text-muted:#91a8bc;--theme-icon-filter:saturate(1.04) brightness(1.02); }
  .orbita { --primary:#08e2ef;--border:#2a5c77;--surface:#06182b;--text-muted:#92aec3;--theme-icon-filter:saturate(1.18) brightness(1.04); }
  .cobalto { --primary:#5d91ff;--border:#354b7a;--surface:#09142e;--text-muted:#9caacc;--theme-icon-filter:hue-rotate(18deg) saturate(.92) brightness(1.08); }
  .aurora { --primary:#32e6c1;--border:#2d615f;--surface:#08252b;--text-muted:#8fbab4;--theme-icon-filter:hue-rotate(-18deg) saturate(.94) brightness(1.06); }
  .solar { --primary:#ffb547;--border:#655137;--surface:#211910;--text-muted:#bda888;--theme-icon-filter:sepia(.84) saturate(1.9) hue-rotate(350deg) brightness(1.06); }
  .indigo { --primary:#a5a6ff;--border:#554d80;--surface:#181331;--text-muted:#a59dbf;--theme-icon-filter:hue-rotate(34deg) saturate(.88) brightness(1.08); }
  .lunar { --primary:#006dcc;--border:#9eb5c4;--surface:#f7fbfd;--text:#071c33;--text-muted:#506a80;color:#071c33;--theme-icon-filter:saturate(1.12) brightness(.82) contrast(1.14); }
</style>
<div class="grid" id="grid"></div>
<script>
  const themes = [
    ['essential', 'PMP Essencial'], ['orbita', 'Orbita Ciano'], ['cobalto', 'Eclipse Cobalto'],
    ['aurora', 'Aurora Polar'], ['solar', 'Horizonte Solar'], ['indigo', 'Nebulosa Indigo'], ['lunar', 'Lunar Claro'],
  ];
  const brands = [['YT_youtube.svg', 'YouTube'], ['TT_tiktok.svg', 'TikTok'], ['IG_instagram.svg', 'Instagram']];
  document.querySelector('#grid').innerHTML = themes.map(([className, label]) => `
    <div class="case ${className}">
      <div>${label}<small>cores oficiais preservadas</small></div>
      <div class="row">${brands.map(([file, brand]) => `
        <span class="campaign-platform-mark campaign-platform-mark-artwork" title="${brand}">
          <img class="campaign-platform-mark-artwork-image" src="http://127.0.0.1:3000/assets/icons/${file}" alt="${brand}">
        </span>`).join('')}</div>
    </div>`).join('');
</script>
