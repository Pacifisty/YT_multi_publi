  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#00194F" flood-opacity=".34"/>
  </filter>
</defs>


<g filter="url(#shadow)" stroke-linejoin="round">
  <path d="M116 150c0-18 14-32 32-32h88l28 34h100c18 0 32 14 32 32v134H116z" fill="url(#blue)" stroke="url(#cyan)" stroke-width="12"/>
