<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Dashboard / fila de campanhas</title>
<desc id="desc">Ícone FILA em estilo PMP, fundo transparente.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0631A8"/>
    <stop offset="55%" stop-color="#0A69E8"/>
    <stop offset="100%" stop-color="#18E0E8"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#35F5FF"/>
    <stop offset="100%" stop-color="#00B1FF"/>
  </linearGradient>
  <linearGradient id="whitegrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#E5F2FF"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#00194F" flood-opacity=".35"/>
  </filter>
</defs>

<g filter="url(#shadow)">
  <circle cx="256" cy="210" r="164" fill="url(#bg)" stroke="url(#cyan)" stroke-width="14"/>
</g>

<g filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round">
  <rect x="220" y="110" width="170" height="102" rx="24" fill="url(#whitegrad)" stroke="#CFE8FF" stroke-width="6"/>
  <rect x="200" y="160" width="170" height="102" rx="24" fill="url(#whitegrad)" stroke="#D6ECFF" stroke-width="6"/>
  <rect x="130" y="210" width="220" height="110" rx="28" fill="url(#whitegrad)" stroke="#FFFFFF" stroke-width="10"/>
  <rect x="150" y="230" width="52" height="70" rx="12" fill="url(#bg)"/>
  <rect x="220" y="232" width="70" height="16" rx="8" fill="#0A69E8"/>
  <rect x="220" y="264" width="116" height="12" rx="6" fill="#93D7FF"/>
  <text x="176" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">1</text>
  <rect x="220" y="180" width="52" height="62" rx="12" fill="url(#bg)"/>
  <rect x="286" y="183" width="60" height="14" rx="7" fill="#0A69E8"/>
  <rect x="286" y="210" width="98" height="10" rx="5" fill="#93D7FF"/>
  <text x="246" y="221" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">2</text>
  <rect x="240" y="128" width="50" height="58" rx="12" fill="url(#bg)"/>
  <rect x="302" y="131" width="56" height="14" rx="7" fill="#0A69E8"/>
  <rect x="302" y="156" width="88" height="10" rx="5" fill="#93D7FF"/>
  <text x="265" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">3</text>
</g>

<g filter="url(#shadow)">
  <rect x="108" y="382" width="296" height="86" rx="43" fill="#073AA1" stroke="url(#cyan)" stroke-width="8"/>
  <text x="256" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#FFFFFF">FILA</text>
</g>
</svg>
