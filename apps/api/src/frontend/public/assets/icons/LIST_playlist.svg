<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Playlist</title>
<desc id="desc">Ícone LIST em estilo PMP, com fundo transparente.</desc>

<defs>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0636AE"/>
    <stop offset="55%" stop-color="#0A68E8"/>
    <stop offset="100%" stop-color="#18DEE9"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#44F4FF"/>
    <stop offset="100%" stop-color="#00B4FF"/>
  </linearGradient>
  <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#DDEEFF"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#00194F" flood-opacity=".34"/>
  </filter>
</defs>


<g filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round">
  <rect x="112" y="92" width="288" height="250" rx="34" fill="url(#blue)" stroke="url(#cyan)" stroke-width="12"/>
  <circle cx="162" cy="152" r="11" fill="#FFFFFF"/>
  <circle cx="162" cy="216" r="11" fill="#FFFFFF"/>
  <circle cx="162" cy="280" r="11" fill="#FFFFFF"/>
  <path d="M198 152h144M198 216h144M198 280h144" stroke="#FFFFFF" stroke-width="18"/>
  <circle cx="338" cy="310" r="38" fill="url(#cyan)" stroke="#FFFFFF" stroke-width="8"/>
  <path d="M326 290v40l30-20z" fill="#FFFFFF"/>
</g>

<g filter="url(#shadow)">
  <rect x="96.0" y="390" width="320" height="82" rx="41" fill="#073A9F" stroke="url(#cyan)" stroke-width="8"/>
  <text x="256" y="446" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">LIST</text>
</g>
</svg>
