<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Dashboard / adicionar</title>
<desc id="desc">Ícone NEW em estilo PMP, fundo transparente.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0631A8"/>
    <stop offset="55%" stop-color="#0A69E8"/>
    <stop offset="100%" stop-color="#18E0E8"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#35F5FF"/>
    <stop offset="100%" stop-color="#00B1FF"/>
  </linearGradient>
  <linearGradient id="whitegrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#E5F2FF"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#00194F" flood-opacity=".35"/>
  </filter>
</defs>

<g filter="url(#shadow)">
  <circle cx="256" cy="210" r="164" fill="url(#bg)" stroke="url(#cyan)" stroke-width="14"/>
</g>

<g filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round">
  <rect x="150" y="118" width="212" height="182" rx="32" fill="url(#whitegrad)" stroke="#FFFFFF" stroke-width="10"/>
  <path d="M150 160h212" stroke="#0ACFE7" stroke-width="10"/>
  <circle cx="180" cy="140" r="7" fill="#0AAAF0"/>
  <circle cx="205" cy="140" r="7" fill="#0AAAF0"/>
  <circle cx="230" cy="140" r="7" fill="#0AAAF0"/>
  <circle cx="256" cy="226" r="70" fill="url(#bg)" stroke="#FFFFFF" stroke-width="10"/>
  <path d="M256 188v76M218 226h76" stroke="#FFFFFF" stroke-width="22"/>
</g>

<g filter="url(#shadow)">
  <rect x="108" y="382" width="296" height="86" rx="43" fill="#073AA1" stroke="url(#cyan)" stroke-width="8"/>
  <text x="256" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#FFFFFF">NEW</text>
</g>
</svg>
