<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Confirmação / check</title>
<desc id="desc">Ícone PMP OK em azul-ciano.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#062E91"/>
    <stop offset="58%" stop-color="#075EE4"/>
    <stop offset="100%" stop-color="#04DDE8"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#35F5FF"/>
    <stop offset="100%" stop-color="#00A9FF"/>
  </linearGradient>
  <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#DCEBFF"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#001A49" flood-opacity=".38"/>
  </filter>
</defs>

<circle cx="256" cy="208" r="164" fill="url(#bg)" stroke="url(#cyan)" stroke-width="14" filter="url(#shadow)"/>

<g filter="url(#shadow)">
  <circle cx="256" cy="210" r="104" fill="url(#cyan)" stroke="#FFFFFF" stroke-width="14"/>
  <circle cx="256" cy="210" r="78" fill="url(#bg)" opacity=".72"/>
  <path d="M197 214l39 39 79-89" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<rect x="116" y="382" width="280" height="86" rx="43" fill="#073A99" stroke="url(#cyan)" stroke-width="8" filter="url(#shadow)"/>
<text x="256" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" fill="#FFFFFF">OK</text>
</svg>
