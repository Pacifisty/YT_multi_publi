<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Armazenamento</title>
<desc id="desc">Ícone STO em estilo PMP, com fundo transparente.</desc>

<defs>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0636AE"/>
    <stop offset="55%" stop-color="#0A68E8"/>
    <stop offset="100%" stop-color="#18DEE9"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#44F4FF"/>
    <stop offset="100%" stop-color="#00B4FF"/>
  </linearGradient>
  <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#DDEEFF"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#00194F" flood-opacity=".34"/>
  </filter>
</defs>


<g filter="url(#shadow)">
  <ellipse cx="256" cy="128" rx="112" ry="44" fill="url(#white)" stroke="url(#cyan)" stroke-width="10"/>
  <path d="M144 128v150c0 24 50 44 112 44s112-20 112-44V128" fill="url(#blue)" stroke="url(#cyan)" stroke-width="10"/>
  <ellipse cx="256" cy="204" rx="112" ry="44" fill="none" stroke="#FFFFFF" stroke-width="10"/>
  <ellipse cx="256" cy="278" rx="112" ry="44" fill="none" stroke="#FFFFFF" stroke-width="10"/>
</g>

<g filter="url(#shadow)">
  <rect x="106.0" y="390" width="300" height="82" rx="41" fill="#073A9F" stroke="url(#cyan)" stroke-width="8"/>
  <text x="256" y="446" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">STO</text>
</g>
</svg>
