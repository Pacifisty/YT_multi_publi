<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Contas / sincronização</title>
<desc id="desc">Ícone SYNC em estilo PMP, com fundo transparente.</desc>

<defs>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0736B3"/>
    <stop offset="55%" stop-color="#0A68E8"/>
    <stop offset="100%" stop-color="#17DEE9"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#43F5FF"/>
    <stop offset="100%" stop-color="#00B3FF"/>
  </linearGradient>
  <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#DDEEFF"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#00194F" flood-opacity=".34"/>
  </filter>
</defs>


<g filter="url(#shadow)">
  <circle cx="256" cy="210" r="154" fill="url(#blue)" stroke="url(#cyan)" stroke-width="12"/>
  <path d="M164 180c17-43 55-70 101-70 42 0 78 22 98 58"
