  <path d="M346 136l30 37-46 12z" fill="#FFFFFF" stroke="#BEEBFF" stroke-width="4" stroke-linejoin="round"/>
  <path d="M348 240c-17 43-55 70-101 70-42 0-78-22-98-58"
