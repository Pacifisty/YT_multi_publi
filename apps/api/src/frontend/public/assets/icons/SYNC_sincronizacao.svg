  <path d="M166 284l-30-37 46-12z" fill="#FFFFFF" stroke="#BEEBFF" stroke-width="4" stroke-linejoin="round"/>
</g>

<g filter="url(#shadow)">
  <rect x="96.0" y="390" width="320" height="82" rx="41" fill="#073A9F" stroke="url(#cyan)" stroke-width="8"/>
  <text x="256" y="446" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF">SYNC</text>
</g>
</svg>
