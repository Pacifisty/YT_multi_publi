<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Indicadores / crescimento</title>
<desc id="desc">Indicador de crescimento em estilo PMP, com fundo transparente.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0631A8"/>
    <stop offset="55%" stop-color="#0A69E8"/>
    <stop offset="100%" stop-color="#18E0E8"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#35F5FF"/>
    <stop offset="100%" stop-color="#00B1FF"/>
  </linearGradient>
  <linearGradient id="whitegrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#E5F2FF"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#00194F" flood-opacity=".35"/>
  </filter>
</defs>

<g transform="translate(-46 8) scale(1.18)" filter="url(#shadow)">
  <circle cx="256" cy="210" r="164" fill="url(#bg)" stroke="url(#cyan)" stroke-width="14"/>
</g>

