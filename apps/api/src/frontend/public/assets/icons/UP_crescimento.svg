  <path d="M154 304V132" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <path d="M154 304H344" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <rect x="184" y="252" width="34" height="52" rx="10" fill="url(#whitegrad)"/>
  <rect x="234" y="216" width="34" height="88" rx="10" fill="url(#whitegrad)"/>
  <rect x="284" y="176" width="34" height="128" rx="10" fill="url(#whitegrad)"/>
  <path d="M188 250l58-52 42 18 78-78" fill="none" stroke="#19E1EA" stroke-width="18"/>
  <path d="M336 138h30v30" fill="none" stroke="#19E1EA" stroke-width="18"/>
  <path d="M366 138l-58 58" fill="none" stroke="#19E1EA" stroke-width="18"/>
</g>
</svg>
