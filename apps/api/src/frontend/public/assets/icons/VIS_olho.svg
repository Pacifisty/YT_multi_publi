<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Contas / visibilidade</title>
<desc id="desc">Ícone VIS em estilo PMP, com fundo transparente.</desc>

<defs>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0736B3"/>
    <stop offset="55%" stop-color="#0A68E8"/>
    <stop offset="100%" stop-color="#17DEE9"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#43F5FF"/>
    <stop offset="100%" stop-color="#00B3FF"/>
  </linearGradient>
  <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#DDEEFF"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#00194F" flood-opacity=".34"/>
  </filter>
</defs>


<g filter="url(#shadow)">
  <circle cx="256" cy="210" r="154" fill="url(#blue)" stroke="url(#cyan)" stroke-width="12"/>
  <path d="M112 210c38-64 88-96 144-96s106 32 144 96c-38 64-88 96-144 96s-106-32-144-96z"
        fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round"/>
  <circle cx="256" cy="210" r="66" fill="url(#cyan)" stroke="#FFFFFF" stroke-width="12"/>
  <circle cx="256" cy="210" r="32" fill="#073A9F"/>
  <circle cx="276" cy="190" r="11" fill="#FFFFFF"/>
  <circle cx="244" cy="228" r="6" fill="#DFF8FF"/>
</g>

<g filter="url(#shadow)">
  <rect x="116.0" y="390" width="280" height="82" rx="41" fill="#073A9F" stroke="url(#cyan)" stroke-width="8"/>
  <text x="256" y="446" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF">VIS</text>
</g>
</svg>
